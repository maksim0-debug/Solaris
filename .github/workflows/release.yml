name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    defaults:
      run:
        working-directory: solaris

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Validate Secrets
        shell: bash
        run: |
          MISSING_SECRETS=()
          [ -z "$MAPBOX_TOKEN" ] && MISSING_SECRETS+=("MAPBOX_TOKEN")
          [ -z "$GOOGLE_CLIENT_ID" ] && MISSING_SECRETS+=("GOOGLE_CLIENT_ID")
          [ -z "$WEATHER_API_KEY" ] && MISSING_SECRETS+=("WEATHER_API_KEY")

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "::warning::Missing GitHub Secrets for production API keys: ${MISSING_SECRETS[*]}"
            echo "Solaris will be built with fallback features (no real map/weatherapi)."
          fi
          
          if [ -n "$MAPBOX_TOKEN" ] && [[ ! "$MAPBOX_TOKEN" =~ ^(pk|sk)\. ]]; then
            echo "::warning::MAPBOX_TOKEN is invalid. It must start with 'pk.' or 'sk.'."
          fi
          echo "Secret check complete."
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}

      - name: Create .env file
        shell: bash
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          printf "MAPBOX_TOKEN=%s\n" "${MAPBOX_TOKEN:-your_mapbox_token_here}" > .env
          printf "GOOGLE_CLIENT_ID=%s\n" "${GOOGLE_CLIENT_ID:-your_client_id_here}" >> .env
          printf "WEATHER_API_KEY=%s\n" "${WEATHER_API_KEY:-your_weather_api_key_here}" >> .env
          echo ".env file created successfully."

      - name: Generate obfuscated code
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Release
        shell: pwsh
        run: |
          $buildDir = "build/windows/x64/runner/Release"
          $releaseDir = "Solaris_Release"
          if (Test-Path $releaseDir) { Remove-Item -Recurse -Force $releaseDir }
          New-Item -ItemType Directory -Path $releaseDir

          # Copy executable, dlls, and data folder
          Copy-Item "$buildDir/*.exe" -Destination $releaseDir/
          Copy-Item "$buildDir/*.dll" -Destination $releaseDir/
          Copy-Item -Path "$buildDir/data" -Destination "$releaseDir/data" -Recurse

          # Copy LICENSE and README.md
          Copy-Item "LICENSE" -Destination $releaseDir/
          Copy-Item "README.md" -Destination $releaseDir/

          # Create archive in the root directory
          Compress-Archive -Path "$releaseDir/*" -DestinationPath ../Solaris-Windows.zip

      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'Solaris-Windows.zip'

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: Solaris-Windows.zip
          generate_release_notes: true
          append_body: true
          body: |
            ### 🛡️ Verification
            This release is signed with a GitHub Artifact Attestation.
            To verify the authenticity of the archive, run:
            ```bash
            gh attestation verify Solaris-Windows.zip --owner ${{ github.repository_owner }}
            ```

            You can view the build attestation history here:
            https://github.com/${{ github.repository }}/attestations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
