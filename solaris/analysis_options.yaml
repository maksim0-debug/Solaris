# Official Flutter recommended lints
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Strict type safety configuration:
    strict-casts: true # Disallows implicit type casts (e.g. from dynamic)
    strict-inference: true # Disallows inferring dynamic when type is not explicitly specified
    strict-raw-types: true # Requires type arguments for generic types (e.g. List<String> instead of List)

  errors:
    # Treat critical bugs and dead code as compilation errors
    dead_code: error
    always_declare_return_types: error

    # Display deprecated API usage and TODOs (do not suppress)
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: warning
    todo: info
    unused_import: warning
    unused_local_variable: warning

  exclude:
    # Dart analyzer ignores build outputs, generated code, and non-Dart native platform directories:
    - "build/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - ".dart_tool/**"
    - "windows/**"
    - "android/**"
    - "ios/**"
    - "web/**"
    - "macos/**"
    - "linux/**"

linter:
  rules:
    # Code hygiene & memory leak prevention:
    cancel_subscriptions: true
    close_sinks: true
    unawaited_futures: true
    avoid_empty_else: true
    avoid_relative_lib_imports: true
    avoid_void_async: true
    prefer_single_quotes: true

    # Application-specific overrides:
    # Internal desktop application; docstrings for all public members are optional
    public_member_api_docs: false
